[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-event-triage"
version = "0.1.0"
description = "Deterministic, evidence-based Kubernetes event triage for JSONL logs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
k8s-triage = "k8s_event_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_event_triage"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/wheel_metadata.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "scripts", "pyproject.toml", "README.md", "ANALYSIS.md", "outputs", "requirements-dev.in", "requirements-dev.lock", "Makefile", "Dockerfile", ".dockerignore", ".gitattributes", ".gitignore", ".github", "config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
