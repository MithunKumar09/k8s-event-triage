name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Verify evidence against its executable ancestor commit.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install PYTHON=python
      - run: make check build
      - name: Install wheel in a separate runtime environment
        run: |
          python -m venv build/runtime
          build/runtime/bin/python -m pip install --no-index --no-deps dist/*.whl
          build/runtime/bin/k8s-triage test-cases/01-healthy.jsonl
          build/runtime/bin/python scripts/capture_outputs.py --wheel dist/*.whl --verify
      - run: make audit
      - run: make docker-build docker-run
